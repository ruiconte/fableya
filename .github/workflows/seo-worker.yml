name: Fableya editorial worker
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: fableya-seo-worker
  cancel-in-progress: false
jobs:
  editorial:
    if: vars.SEO_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Research, draft, sync metrics and publish approved scheduled articles
        run: node seo/worker.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEO_OPENAI_MODEL: ${{ vars.SEO_OPENAI_MODEL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          SEO_DESTINATIONS: ${{ vars.SEO_DESTINATIONS }}
          SEO_WORDPRESS_URL: ${{ vars.SEO_WORDPRESS_URL }}
          SEO_WORDPRESS_USER: ${{ secrets.SEO_WORDPRESS_USER }}
          SEO_WORDPRESS_APP_PASSWORD: ${{ secrets.SEO_WORDPRESS_APP_PASSWORD }}
          SEO_DEV_API_KEY: ${{ secrets.SEO_DEV_API_KEY }}
